g = "Good"

time-greeting = """
$period ->
  [morning] {g} Morning
  [evening] {g} Evening
  *[other] {g} {$period}
"""

salutation = """
$gender ->
  [male] Mr.
  *[female] Ms.
"""

greeting = "{ time-greeting }! { salutation }{ $name }"

