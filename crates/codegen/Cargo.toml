[package]
name = "glossa-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
categories.workspace = true
# readme = "../../docs/Readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Generate const language localisation map code at compile time"

[features]
# default = ["yaml", "ron", "toml", "json", "highlight"]
# default = ["yaml", "highlight"]
default = ["yaml", "toml"]
all = ["yaml", "json", "json5", "ron", "toml", "highlight"]
yaml = ["dep:serde_yml"]
json = ["dep:serde_json"]
json5 = ["dep:serde_json5"]
ron = ["dep:ron"]
toml = ["dep:toml"]
highlight = ["dep:hlight"]

[dependencies]
phf.workspace = true
phf_codegen.workspace = true
getset.workspace = true
log.workspace = true
serde = { workspace = true, features = ["std"] }
tap.workspace = true
ahash.workspace = true
nom.workspace = true
ron = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
hlight = { workspace = true, optional = true }
kstring = { workspace = true, features = ["serde"] }
lang-id = { workspace = true, features = ["map", "match", "serde"] }
compact_str = { workspace = true, features = ["serde", "std"] }
thiserror = { workspace = true, features = ["std"] }
rayon.workspace = true
anyhow.workspace = true
itertools.workspace = true
# dashmap = { version = "6.1", features = ["rayon"] }
dashmap = "6.1"
bincode = { workspace = true, features = ["serde", "std"] }
# phf_shared.workspace = true
walkdir = "2.5"
serde_json5 = { version = "0.2", optional = true }
glossa-shared.workspace = true
tmpl-resolver = { workspace = true, features = ["all"] }
smallvec.workspace = true

[package.metadata.docs.rs]
all-features = true
# targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dev-dependencies]
testutils = { workspace = true, features = ["std"] }
glossa-shared = { workspace = true, features = ["bincode", "std"] }
